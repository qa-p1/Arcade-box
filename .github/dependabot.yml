# Weekly, one grouped pull request per ecosystem for minor and patch updates (majors stay separate), and no
# automatic rebase: each rebase started a full three-OS CI build per open pull request whenever main moved, which
# queued release work behind them (Box D15). Ask "@dependabot rebase" on a pull request to refresh it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    groups:
      cargo: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /apps/desktop/frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    groups:
      npm: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    rebase-strategy: disabled
    groups:
      actions: { update-types: [minor, patch] }
