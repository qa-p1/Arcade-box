# Builds every platform once from a release-candidate tag and publishes the files as a hidden prerelease on the test
# channel (Link's reusable publish: arcade-release.json + an unsigned manifest.json). "Tag a release" starts it; it
# can also be run by hand on an rc tag. The installers are the ones CI builds and verifies on each OS (ci.yml is
# called here). Every exit gate runs against the published files; "Promote" then republishes the same bytes as
# stable with a signed manifest. Nothing here publishes stable (PLAN.md rule zero).
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: box-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag is this version's release candidate
        id: release
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          tag="${GITHUB_REF#refs/tags/}"
          [[ "$GITHUB_REF" == refs/tags/* && "$tag" =~ ^v${version//./\\.}-rc\.[1-9][0-9]*$ ]] \
            || { echo "::error::run Release on a tag v$version-rc.N (got $GITHUB_REF)"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [prepare, ci]
    permissions:
      contents: write
    uses: qa-p1/Arcade-Link/.github/workflows/app-publish.yml@v1.0.7
    with:
      app: arcade.box
      version: ${{ needs.prepare.outputs.version }}
      tag: ${{ needs.prepare.outputs.tag }}
      channel: test
      artifacts: arcade-box-*
      link-ref: v1.0.7
