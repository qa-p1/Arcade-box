name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_BUILD_JOBS: 3

permissions:
  contents: read

defaults:
  run:
    working-directory: Arcade-box

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          path: Arcade-box
      - name: Check out the pinned Arcade Link protocol
        uses: actions/checkout@v7
        with:
          repository: qa-p1/Arcade-Link
          ref: 85f9d6224f98fe53db6d8c5299b045326dbeeaa4
          path: Arcade-link
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Arcade-box/apps/desktop/frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Arcade-box -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev qpdf ffmpeg libvips-tools
      - name: Install frontend dependencies
        working-directory: Arcade-box/apps/desktop/frontend
        run: npm ci
      - name: Check frontend types and accessibility diagnostics
        working-directory: Arcade-box/apps/desktop/frontend
        run: npm run check
      - name: Build frontend
        working-directory: Arcade-box/apps/desktop/frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test shared runtime
        env:
          ARCADE_HOME: ${{ runner.temp }}/arcade-box-ci
        run: cargo test --workspace --exclude arcade-desktop --locked
      - name: Build desktop on target OS
        run: cargo build -p arcade-desktop --locked
      - name: Check tool catalog matrix
        run: python catalog/render_tool_matrix.py --check
      - name: Check locked license inventory
        run: python scripts/license_inventory.py --check
