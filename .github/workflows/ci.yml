name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  CARGO_BUILD_JOBS: 3

permissions:
  contents: read

defaults:
  run:
    working-directory: Arcade-box

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: appimage
            installer: Arcade-box/target/release/bundle/appimage/*.AppImage
          # windows-latest now resolves Visual Studio 2026 without a C/C++
          # toolchain, so zxing-cpp cannot configure; stay on the 2022 image.
          - os: windows-2022
            bundle: nsis
            installer: Arcade-box/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            bundle: dmg
            installer: Arcade-box/target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          path: Arcade-box
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Arcade-box/apps/desktop/frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Arcade-box -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev qpdf ffmpeg libvips-tools
      - name: Install frontend dependencies
        working-directory: Arcade-box/apps/desktop/frontend
        run: npm ci
      - name: Check frontend types and accessibility diagnostics
        working-directory: Arcade-box/apps/desktop/frontend
        run: npm run check
      - name: Build frontend
        working-directory: Arcade-box/apps/desktop/frontend
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Clippy on every target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Documentation, shortcuts and vendored sources
        run: python scripts/check-docs.py && python scripts/check-vendored.py
      - name: Test shared runtime
        env:
          ARCADE_HOME: ${{ runner.temp }}/arcade-box-ci
        run: python scripts/isolate.py cargo test --workspace --locked
      - name: Build desktop on target OS
        run: cargo build -p arcade-desktop --locked
      - name: Check tool catalog matrix
        run: python catalog/render_tool_matrix.py --check
      - name: Check locked license inventory
        run: python scripts/license_inventory.py --check
      - name: Stage the CLI and trusted plugin worker
        run: python scripts/prepare-bundle.py
      - name: Install the pinned Tauri bundler
        run: npm install --prefix target/tauri-cli --cache target/npm-cache --no-audit --no-fund @tauri-apps/cli@2.12.1
      - name: Build the installer
        working-directory: Arcade-box/apps/desktop/src-tauri
        run: node ../../../target/tauri-cli/node_modules/@tauri-apps/cli/tauri.js build --ci --config tauri.bundle.conf.json --bundles ${{ matrix.bundle }}
      - name: Verify NSIS silent install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/verify-nsis.ps1 -SetupPattern 'target/release/bundle/nsis/*-setup.exe' -Id arcade.box -Name 'Arcade Box' -CliName arcade-desktop
      - name: Verify DMG silent install in a temporary home
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-dmg.sh target/release/bundle/dmg/*.dmg 'Arcade Box' arcade-desktop arcade.box
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: arcade-box-${{ matrix.bundle }}
          if-no-files-found: error
          path: ${{ matrix.installer }}
