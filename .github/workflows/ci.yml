name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml builds its installers with this workflow.
  workflow_call:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

defaults:
  run:
    working-directory: Arcade-box

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: appimage
            installer: Arcade-box/target/release/bundle/appimage/*.AppImage
          # windows-latest now resolves Visual Studio 2026 without a C/C++
          # toolchain, so zxing-cpp cannot configure; stay on the 2022 image.
          - os: windows-2022
            bundle: nsis
            installer: Arcade-box/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            bundle: dmg
            args: --target universal-apple-darwin
            sidecar-args: --target universal-apple-darwin
            installer: Arcade-box/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          path: Arcade-box
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Arcade-box/apps/desktop/frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Arcade-box -> target
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev qpdf ffmpeg libvips-tools
      - name: Install frontend dependencies
        working-directory: Arcade-box/apps/desktop/frontend
        run: npm ci
      - name: Install Chromium for the layout check
        if: runner.os == 'Linux'
        working-directory: Arcade-box/apps/desktop/frontend
        run: npx playwright install --with-deps chromium
      # Types, unit and layout tests, frontend build, CSS variables, the one
      # version, docs, vendored hashes, fmt, clippy, isolated tests, the
      # desktop build, the tool matrix and the licence inventory.
      - name: Run scripts/check
        shell: bash
        env:
          ARCADE_HOME: ${{ runner.temp }}/arcade-box-ci
        run: scripts/check
      - name: Stage the CLI and trusted plugin worker
        run: python scripts/prepare-bundle.py ${{ matrix.sidecar-args }}
      - name: Install the pinned Tauri bundler
        run: npm install --prefix target/tauri-cli --cache target/npm-cache --no-audit --no-fund @tauri-apps/cli@2.12.1
      - name: Build the installer
        working-directory: Arcade-box/apps/desktop/src-tauri
        run: node ../../../target/tauri-cli/node_modules/@tauri-apps/cli/tauri.js build --ci --config tauri.bundle.conf.json --bundles ${{ matrix.bundle }} ${{ matrix.args }} -- --locked
      - name: Verify AppImage install, repair and uninstall in a temporary profile
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb dbus-x11
          dbus-run-session -- xvfb-run -a python3 scripts/verify-appimage.py target/release/bundle/appimage/*.AppImage arcade.box Arcade-Box.AppImage arcade-desktop
      - name: Tray icon registration (real StatusNotifierWatcher, isolated)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xdotool python3-dbus python3-gi
          git -c advice.detachedHead=false clone -q --depth 1 --branch v0.4.0 https://github.com/qa-p1/Arcade-Link "$RUNNER_TEMP/link"
          cargo build --release --manifest-path "$RUNNER_TEMP/link/Cargo.toml" -p arcade-link-cli
          /usr/bin/python3 "$RUNNER_TEMP/link/tools/e2e.py" run -- /usr/bin/python3 tests/tray-registration.py target/release/arcade-desktop "$RUNNER_TEMP/link/target/release/arcade-link" box
      - name: Verify NSIS silent install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/verify-nsis.ps1 -SetupPattern 'target/release/bundle/nsis/*-setup.exe' -Id arcade.box -Name 'Arcade Box' -CliName arcade-desktop
      - name: Verify universal DMG install and uninstall in a temporary home
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-dmg.sh target/universal-apple-darwin/release/bundle/dmg/*.dmg 'Arcade Box' arcade-desktop arcade.box
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: arcade-box-${{ matrix.bundle }}
          if-no-files-found: error
          path: ${{ matrix.installer }}
