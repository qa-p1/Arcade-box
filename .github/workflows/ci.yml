name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml builds its installers with this workflow.
  workflow_call:

env:
  PYTHONUTF8: "1"

permissions:
  contents: read

defaults:
  run:
    working-directory: Arcade-box

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundle: appimage
            installer: Arcade-box/target/release/bundle/appimage/*.AppImage
          # windows-latest now resolves Visual Studio 2026 without a C/C++
          # toolchain, so zxing-cpp cannot configure; stay on the 2022 image.
          - os: windows-2022
            bundle: nsis
            installer: Arcade-box/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            bundle: dmg
            args: --target universal-apple-darwin
            sidecar-args: --target universal-apple-darwin
            installer: Arcade-box/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v7
        with:
          path: Arcade-box
      - name: Pinned Link runner for the isolated tray gate
        if: runner.os == 'Linux'
        uses: actions/checkout@v7
        with:
          repository: qa-p1/Arcade-Link
          ref: v0.4.0
          path: Arcade-Link
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Arcade-box/apps/desktop/frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Arcade-box -> target
            ${{ runner.os == 'Linux' && 'Arcade-Link -> target' || '' }}
          # Restore on every ref; only main can warm future PRs and tags.
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          scripts/apt-install.sh
          libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev qpdf ffmpeg libvips-tools lua5.4
          xvfb dbus-x11 xdotool python3-dbus python3-gi
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire
      - name: Install frontend dependencies
        working-directory: Arcade-box/apps/desktop/frontend
        run: npm ci
      - name: Install Chromium for the layout check
        if: runner.os == 'Linux'
        working-directory: Arcade-box/apps/desktop/frontend
        run: npx playwright install --with-deps chromium
      # Types, unit and layout tests, frontend build, CSS variables, the one
      # version, docs, vendored hashes, fmt, clippy, isolated tests, the
      # desktop build, the tool matrix and the licence inventory.
      - name: Run scripts/check
        shell: bash
        env:
          ARCADE_HOME: ${{ runner.temp }}/arcade-box-ci
        run: scripts/check
      - name: Stage the CLI and trusted plugin worker
        run: python scripts/prepare-bundle.py ${{ matrix.sidecar-args }}
      - name: Install the pinned Tauri bundler
        run: npm install --prefix target/tauri-cli --cache target/npm-cache --no-audit --no-fund @tauri-apps/cli@2.12.1
      - name: Build the installer
        working-directory: Arcade-box/apps/desktop/src-tauri
        shell: bash
        # Tauri downloads its bundler tools (AppRun, NSIS) from GitHub releases with one attempt, which answer 504 at
        # times; a retry reuses the finished build and only repeats the bundling.
        run: |
          for i in 1 2 3; do
            node ../../../target/tauri-cli/node_modules/@tauri-apps/cli/tauri.js build --ci --config tauri.bundle.conf.json --bundles ${{ matrix.bundle }} ${{ matrix.args }} -- --locked && exit 0
            [ "$i" = 3 ] || sleep $((i * 30))
          done
          exit 1
      # THIRD_PARTY_NOTICES covers the Ubuntu packages linuxdeploy bundled (WebKitGTK, GTK, ...); a new one fails here
      # and the regenerated record is uploaded to commit.
      - name: Notices cover the bundled native libraries
        id: native
        if: matrix.bundle == 'appimage'
        timeout-minutes: 5
        run: python3 scripts/native-notices.py --check target/release/bundle/appimage/*.AppImage
      - uses: actions/upload-artifact@v4
        if: failure() && steps.native.outcome == 'failure'
        with:
          name: native-notices
          # `uses` steps run from the workspace root, not the job's working directory.
          path: Arcade-box/packaging/linux/native
      - name: Verify AppImage install, repair and uninstall in a temporary profile
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- xvfb-run -a python3 scripts/verify-appimage.py target/release/bundle/appimage/*.AppImage arcade.box Arcade-Box.AppImage arcade-desktop
      - name: Verify Island close/reopen keeps the resident process
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a python3 scripts/verify-resident.py target/release/bundle/appimage/*.AppImage arcade.box
      - name: Tray icon registration (real StatusNotifierWatcher, isolated)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # The runner builds its debug CLI before executing the gate. Reuse it
          # instead of separately compiling an unused release-profile CLI.
          /usr/bin/python3 "$GITHUB_WORKSPACE/Arcade-Link/tools/e2e.py" run -- /usr/bin/python3 tests/tray-registration.py target/release/arcade-desktop "$GITHUB_WORKSPACE/Arcade-Link/target/debug/arcade-link" box
      - name: Verify NSIS silent install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/verify-nsis.ps1 -SetupPattern 'target/release/bundle/nsis/*-setup.exe' -Id arcade.box -Name 'Arcade Box' -CliName arcade-desktop
      - name: Verify universal DMG install and uninstall in a temporary home
        if: runner.os == 'macOS'
        shell: bash
        run: scripts/verify-dmg.sh target/universal-apple-darwin/release/bundle/dmg/*.dmg 'Arcade Box' arcade-desktop arcade.box
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: arcade-box-${{ matrix.bundle }}
          if-no-files-found: error
          path: ${{ matrix.installer }}

  # Tier 1: the Island on headless Hyprland (Link's desktop harness), from the AppImage built above.
  # --workspace: every crate's dependencies, not only the first member's.
  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --workspace --all-features
          command: check

  desktop:
    needs: check
    uses: qa-p1/Arcade-Link/.github/workflows/desktop-e2e.yml@40ec0279095f7a5082b0fbe2912d1a869b98f55d
    with:
      name: box
      test: tests/desktop/island_desktop.py
      args: '"$APP"'
      artifact: arcade-box-appimage
      link-ref: 40ec0279095f7a5082b0fbe2912d1a869b98f55d
