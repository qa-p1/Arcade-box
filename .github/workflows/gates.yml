name: Gates

# PLAN "Release" step 2: every exit gate against the published files of a release candidate, never a local build.
# Run it on the rc tag ("Use workflow from: v1.0.0-rc.N") once "Release" has published it; "Promote" only after a
# green run on the rc it promotes (docs/v1/DECISIONS.md D15, D20). The shared gates (published files and manifest,
# conformance, N-1, budgets, the delta through Tools' updater, Windows and macOS smoke) are Link's app-gates.yml;
# Box adds its own Linux checks and the desktop suites on the published AppImage.
on:
  workflow_dispatch:
    inputs:
      previous:
        description: The previous stable release (upgrade test, and the delta "from the previous release")
        default: v0.4.3

permissions:
  contents: read

concurrency:
  group: box-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    uses: qa-p1/Arcade-Link/.github/workflows/app-gates.yml@v1.0.13
    with:
      app: arcade.box
      name: box
      previous: ${{ inputs.previous }}
      link-ref: v1.0.13
      # native-notices.py maps each bundled file to the package that installed it, so this runner needs every
      # package the build host bundled from: gstreamer1.0-pipewire, libpango1.0-dev, whose unversioned
      # libpango*.so links linuxdeploy copied, and the GObject typelibs (gir1.2-*) the GTK plugin copies from
      # the host. ci.yml's -dev packages install them all; a typelib with no owner here drops out of the list.
      linux-packages: >-
        libwebkit2gtk-4.1-0 libayatana-appindicator3-1 python3-dbus
        gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pipewire libpango1.0-dev
        gir1.2-atk-1.0 gir1.2-atspi-2.0 gir1.2-ayatanaappindicator3-0.1 gir1.2-ayatanaido3-0.4 gir1.2-dazzle-1.0
        gir1.2-dbusmenu-glib-0.4 gir1.2-gtk-3.0 gir1.2-json-1.0 gir1.2-polkit-1.0 gir1.2-soup-3.0
      linux-checks: |
        python3 scripts/native-notices.py --check "$RC"
        dbus-run-session -- xvfb-run -a python3 scripts/verify-appimage.py "$RC" arcade.box Arcade-Box.AppImage arcade-desktop
        dbus-run-session -- xvfb-run -a python3 scripts/verify-upgrade.py "$PREVIOUS" "$RC"
        dbus-run-session -- xvfb-run -a python3 scripts/verify-resident.py "$RC" arcade.box
        python3 ../Arcade-Link/tools/e2e.py run -- /usr/bin/python3 tests/tray-registration.py "$RC" "$(command -v arcade-link)" box
      window: '^Dashboard . Arcade Box$'
      open-args: --dashboard
      windows-check: >-
        pwsh -NoProfile -File scripts/verify-nsis.ps1 -SetupPattern 'rc/*-setup.exe'
        -Id arcade.box -Name 'Arcade Box' -CliName arcade-desktop
      macos-check: scripts/verify-dmg.sh rc/*.dmg 'Arcade Box' arcade-desktop arcade.box

  # Tier 1 (headless Hyprland) blocks on any failure; Tier 2 (sway, KWin, Mutter, X11) on a crash or data loss.
  desktop:
    needs: gates
    uses: qa-p1/Arcade-Link/.github/workflows/desktop-e2e.yml@v1.0.13
    with:
      name: box
      test: tests/desktop/island_desktop.py
      args: '"$APP"'
      artifact: gate-appimage
      link-ref: v1.0.13
  desktop-tier2:
    needs: gates
    uses: qa-p1/Arcade-Link/.github/workflows/desktop-tier2.yml@v1.0.13
    with:
      artifact: gate-appimage
      show: --dashboard
      link-ref: v1.0.13
