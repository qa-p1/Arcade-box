[workspace]
members = [
  "crates/arcade-contract",
  "crates/arcade-core",
  "crates/arcade-plugin-host",
  "apps/cli",
  "apps/desktop/src-tauri",
]
default-members = ["crates/arcade-contract", "crates/arcade-core", "apps/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/qa-p1/Arcade-box"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
# Pin the ecosystem integration branch until Link v0.3.0 is tagged.
arcade-link = { git = "https://github.com/qa-p1/Arcade-Link", tag = "v0.3.0", features = ["engines", "install", "trayhost"] }

# zxing-cpp's bundled C++ build follows the opt-level: at 0 CMake builds Debug,
# which links MSVC's debug runtime (unresolved _CrtDbgReport on Windows).
[profile.dev.package.zxing-cpp]
opt-level = 1
