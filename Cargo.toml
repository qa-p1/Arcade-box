[workspace]
members = [
  "crates/arcade-contract",
  "crates/arcade-core",
  "crates/arcade-plugin-host",
  "apps/cli",
  "apps/desktop/src-tauri",
]
default-members = ["crates/arcade-contract", "crates/arcade-core", "apps/cli"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/arcade-box/arcade-box"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
