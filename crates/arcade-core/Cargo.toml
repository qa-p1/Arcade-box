[package]
name = "arcade-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
arcade-contract = { path = "../arcade-contract" }
arcade-plugin-host = { path = "../arcade-plugin-host", default-features = false, features = ["installer"] }
arcade-link.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
cap-std = "4.0.3"
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk", "network"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif"] }
printpdf = { version = "0.12.8", default-features = false, features = ["images", "jpeg", "png"] }
zxing-cpp = { version = "0.5.3", features = ["bundled", "image"] }
similar = "2.7"
csv = "1.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
unicode-segmentation = "1.13"
rand = "0.9"
regex = "1.13"
base64 = "0.23"
data-encoding = "2.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
url = "2.5"
strsim = "0.11"
sha2 = "0.10"
blake3 = "1.8"
yaml-rust2 = "0.13"
toml = { version = "1.1", features = ["preserve_order"] }
quick-xml = "0.42"
roxmltree = "0.21"
infer = "0.22"
uuid = { version = "1.26", features = ["v4"] }
tempfile = "3.27"
age = { version = "0.12.1", default-features = false, features = ["armor"] }
zxcvbn = { version = "3.1.1", default-features = false }
calamine = { version = "0.36.1", features = ["dates"] }
rust_xlsxwriter = "0.99.1"
emojis = "0.9.0"
lopdf = { version = "0.44", default-features = false }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
