[package]
name = "arcade-plugin-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
arcade-contract = { path = "../arcade-contract" }
libc = "0.2"
sha2 = "0.10"
semver = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3.23"
wasmtime = { version = "=48.0.2", default-features = false, features = ["component-model", "cranelift", "runtime", "std", "wit-parser"], optional = true }
wasmtime-wasi = { version = "=48.0.2", default-features = false, features = ["p2"], optional = true }

[features]
default = ["runtime"]
runtime = ["dep:wasmtime", "dep:wasmtime-wasi"]
installer = []

[[bin]]
name = "arcade-plugin-worker"
path = "src/bin/arcade-plugin-worker.rs"
required-features = ["runtime"]

[lints.rust]
unsafe_code = "forbid"
