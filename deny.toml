# cargo deny check (CI): advisories, licences, bans and sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Accepted advisories, each with its reason (also in SECURITY.md). One is a timing issue in code Box never calls;
# the rest are "unmaintained" notices (no known vulnerability) for crates that come only through dependencies with no
# maintained replacement they can take yet. Revisit when those move.
ignore = [
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 (timing): only age's P-256/HPKE recipients use it; Box encrypts with X25519 and scrypt only, and age 0.12.1 is the latest" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: build-time macro of gtk-rs 0.18 (glib-macros), which Tauri 2 pins on Linux" },
  { id = "RUSTSEC-2024-0436", reason = "paste: build-time macro of rav1e (the image crate's AVIF encoder)" },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range: urlpattern 0.3 in tauri-utils" },
  { id = "RUSTSEC-2025-0080", reason = "unic-common: urlpattern 0.3 in tauri-utils" },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property: urlpattern 0.3 in tauri-utils" },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: urlpattern 0.3 in tauri-utils" },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: urlpattern 0.3 in tauri-utils" },
  { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; ashpd, ksni and the Tauri plugins are on zbus 5" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; ashpd, ksni and the Tauri plugins are on zbus 5" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; ashpd, ksni and the Tauri plugins are on zbus 5" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml: build-time config reader of i18n-embed-fl, age's message macro" },
  { id = "RUSTSEC-2026-0459", reason = "bundled SQLite < 3.54 with a crafted -wal: Box opens only its own arcade.sqlite3 in its data folder, which no less trusted party writes; the fix needs rusqlite 0.41 (Rust 1.89, D6)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "OFL-1.1", "Unlicense", "BSL-1.0", "CDLA-Permissive-2.0", "NCSA",
]
unused-allowed-license = "allow"
# Box's own crates are GPL-3.0-or-later and never published (publish = false).
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Arcade Link, pinned to a release tag.
allow-git = ["https://github.com/qa-p1/Arcade-Link"]
