[package]
name = "arcade-desktop"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2.6"

[dependencies]
arcade-contract = { path = "../../../crates/arcade-contract" }
arcade-core = { path = "../../../crates/arcade-core" }
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = { version = "2.7", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.3"
arcade-link = { workspace = true, features = ["watch"] }
directories = "6.0"
serde_json.workspace = true
serde.workspace = true
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp", "gif"] }
roxmltree = "0.21"
url = "2.5"
tempfile = "3.27"
tokio = { version = "1", features = ["time", "sync"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "screenshot", "screencast", "tokio"] }
libc = "0.2"
futures-channel = "0.3"
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "2.0.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Console"] }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "10.0.3", features = ["async", "macos_14_0", "macos_15_0"] }
